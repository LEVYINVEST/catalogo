<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Prime Imports Premium</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <img class="site-header__logo" src="images/logo-white.png" alt="One Prime Imports Premium">
    <hr class="site-header__underline">
    <p class="site-header__subtitle">Escolha um produto e encomende direto pelo WhatsApp</p>
  </header>

  <div class="catalog-controls">
    <div class="search-box">
      <svg class="search-box__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
      </svg>
      <input type="text" id="search-input" class="search-box__input" placeholder="Buscar produto...">
    </div>
    <div class="filter-chips" id="filter-chips"></div>
  </div>

  <main class="catalog" id="catalog-root"></main>
  <p class="catalog-empty" id="catalog-empty" hidden>Nenhum produto encontrado.</p>

  <footer class="site-footer">
    <p>&copy; 2026 One Prime Imports Premium. Todos os direitos reservados.</p>
    <a class="site-footer__admin" href="login.html">Área administrativa</a>
  </footer>

  <div class="order-bar" id="order-bar" hidden>
    <span class="order-bar__count" id="order-bar-count">0 produtos selecionados</span>
    <div class="order-bar__actions">
      <button class="order-bar__clear" id="order-bar-clear" type="button">Limpar</button>
      <a class="order-bar__button" id="order-bar-button" href="#" target="_blank" rel="noopener noreferrer">
        <svg class="card__button-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path fill="currentColor" d="M16.001 3C9.11 3 3.5 8.61 3.5 15.5c0 2.36.66 4.57 1.8 6.46L3 29l7.24-2.26a12.44 12.44 0 0 0 5.76 1.43h.01c6.89 0 12.5-5.61 12.5-12.5S22.89 3 16.001 3zm0 22.7h-.01a10.35 10.35 0 0 1-5.28-1.45l-.38-.22-4.3 1.34 1.37-4.19-.25-.43a10.34 10.34 0 0 1-1.6-5.5C5.531 9.75 10.28 5 16.001 5c2.77 0 5.37 1.08 7.33 3.04a10.3 10.3 0 0 1 3.03 7.32c0 5.75-4.75 10.34-10.33 10.34zm5.66-7.74c-.31-.16-1.84-.91-2.12-1.01-.29-.11-.5-.16-.7.16-.21.31-.8 1.01-.98 1.22-.18.21-.36.23-.67.08-.31-.16-1.31-.48-2.5-1.54-.92-.82-1.55-1.84-1.73-2.15-.18-.31-.02-.48.14-.63.14-.14.31-.36.47-.55.16-.18.21-.31.31-.52.1-.21.05-.39-.03-.55-.08-.16-.7-1.69-.96-2.31-.25-.61-.51-.52-.7-.53h-.6c-.21 0-.55.08-.83.39-.29.31-1.09 1.06-1.09 2.6s1.12 3.02 1.28 3.23c.16.21 2.2 3.36 5.33 4.71.75.32 1.33.51 1.78.66.75.24 1.43.2 1.97.13.6-.09 1.84-.75 2.1-1.48.26-.73.26-1.35.18-1.48-.08-.13-.28-.21-.59-.36z"/>
        </svg>
        <span>Encomendar selecionados</span>
      </a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script type="module" src="js/catalog-render.js"></script>
</body>
</html>
